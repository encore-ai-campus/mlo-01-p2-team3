{% load static %}
<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}HR 데이터 대시보드{% endblock %}</title>
    <style>
        :root { --ink:#172033; --muted:#667085; --line:#e6eaf0; --canvas:#f5f7fb; --navy:#172554; --violet:#5b4bdb; --green:#087f5b; --amber:#a15c00; }
        * { box-sizing:border-box; }
        body { margin:0; background:var(--canvas); color:var(--ink); font-family:"Noto Sans KR",Arial,sans-serif; }
        a { color:inherit; text-decoration:none; } a:hover { color:var(--violet); }
        .shell { min-height:100vh; display:flex; }
        .side { width:230px; flex:none; padding:24px 16px; color:#e5e7eb; background:var(--navy); }
        .brand { display:flex; gap:10px; align-items:center; margin:0 8px 30px; font-weight:700; }
        .brand-mark { display:grid; place-items:center; width:34px; height:34px; border-radius:10px; background:#7c6bf2; color:#fff; }
        .brand small { display:block; color:#aeb8d5; font-size:11px; font-weight:400; margin-top:2px; }
        .nav-title { margin:20px 10px 8px; color:#9aa6c4; font-size:11px; }
        .nav a { display:block; padding:10px 12px; border-radius:8px; color:#c7d0e8; font-size:14px; }
        .nav a:hover, .nav a.active { background:#2a3766; color:#fff; }
        .side-note { margin:28px 8px 0; padding:12px; border:1px solid #33416f; border-radius:10px; color:#b8c3df; font-size:11px; line-height:1.5; }
        .main { flex:1; min-width:0; }
        .topbar { height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 34px; background:#fff; border-bottom:1px solid var(--line); }
        .crumb { color:var(--muted); font-size:13px; } .crumb strong { color:var(--ink); }
        .chip { padding:6px 10px; border:1px solid var(--line); border-radius:20px; color:var(--muted); font-size:12px; }
        .content { max-width:1280px; margin:0 auto; padding:34px; }
        h1 { margin:4px 0 8px; font-size:30px; letter-spacing:-.04em; } h2 { margin:0; font-size:18px; }
        .eyebrow { margin:0; color:var(--violet); font-size:12px; font-weight:700; letter-spacing:.06em; }
        .desc { margin:0; color:var(--muted); font-size:14px; line-height:1.6; }
        .hero { display:flex; justify-content:space-between; gap:24px; padding:30px; color:#fff; background:linear-gradient(120deg,#1d2854,#33449a); border-radius:16px; box-shadow:0 14px 30px #17255420; }
        .hero .eyebrow { color:#b9c4ff; } .hero .desc { max-width:690px; color:#dbe2ff; }
        .hero-stat { min-width:180px; align-self:center; text-align:right; } .hero-stat strong { display:block; font-size:34px; } .hero-stat span { color:#c7d0f5; font-size:13px; }
        .kpis { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin:18px 0; }
        .card, .panel { background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 4px 14px #17255408; }
        .card { padding:18px; } .label { color:var(--muted); font-size:12px; } .value { margin:9px 0; font-size:28px; font-weight:800; } .foot { color:var(--muted); font-size:12px; }
        .grid2 { display:grid; grid-template-columns:1.25fr .75fr; gap:18px; } .panel { padding:22px; } .panel h2 { margin-bottom:5px; } .panel-sub { color:var(--muted); font-size:12px; }
        .flow { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:20px; } .flow div { padding:15px 10px; text-align:center; border:1px solid #dfe3f0; border-radius:10px; } .flow b { display:block; color:var(--violet); margin-bottom:5px; } .flow span { display:block; color:var(--muted); font-size:12px; }
        .quick { display:flex; gap:8px; flex-wrap:wrap; margin-top:18px; } .button { display:inline-block; border:0; border-radius:8px; padding:9px 13px; background:var(--violet); color:#fff; font-size:13px; cursor:pointer; } .button.secondary { background:#eef0fb; color:#3f3a89; }
        .notice { padding:14px; border-radius:9px; background:#fff8e8; color:var(--amber); font-size:13px; } .error { background:#fff0f0; color:#b42318; }
        .page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:22px; } .actions { display:flex; gap:8px; }
        .filters { display:grid; grid-template-columns:2fr 1fr 1fr 1fr auto; gap:10px; align-items:end; margin-bottom:18px; } label { display:block; margin-bottom:5px; color:var(--muted); font-size:12px; } input, select { width:100%; padding:10px; border:1px solid #d8dce6; border-radius:8px; background:#fff; font:inherit; font-size:13px; }
        .table-wrap { overflow-x:auto; } table { width:100%; border-collapse:collapse; font-size:13px; } th, td { padding:13px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; } th { color:var(--muted); font-size:12px; font-weight:600; background:#fafbfe; } td strong { font-weight:700; } .mono { font-family:Consolas,monospace; font-size:12px; } .link { color:#4536c5; font-weight:600; }
        .tag { display:inline-block; padding:3px 8px; border-radius:99px; background:#eef0f8; color:#535b70; font-size:11px; } .tag.ok { background:#e5f7ef; color:var(--green); } .tag.warn { background:#fff1d8; color:var(--amber); }
        .pagination { display:flex; justify-content:center; align-items:center; gap:12px; padding-top:18px; color:var(--muted); font-size:13px; }
        .detail-head { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:18px; } .detail-id { color:var(--muted); font-family:Consolas,monospace; font-size:12px; } .detail-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:0; margin:0; } .detail-grid div { padding:14px 0; border-bottom:1px solid var(--line); } dt { color:var(--muted); font-size:12px; } dd { margin:5px 0 0; font-size:14px; }
        .tree ul { margin:0; padding-left:22px; list-style:none; } .tree > ul { padding-left:0; } .tree li { margin:9px 0; } .node { display:flex; align-items:center; gap:8px; padding:11px 13px; border:1px solid var(--line); border-radius:9px; background:#fff; } .node span:last-child { margin-left:auto; }
        .empty { padding:28px; color:var(--muted); text-align:center; } .muted { color:var(--muted); }
        @media (max-width:900px) { .side { width:190px; } .content { padding:22px; } .kpis { grid-template-columns:repeat(2,1fr); } .grid2 { grid-template-columns:1fr; } .filters { grid-template-columns:1fr 1fr; } .hero { display:block; } .hero-stat { margin-top:18px; text-align:left; } }
        @media (max-width:560px) { .shell { display:block; } .side { width:auto; } .topbar { padding:0 18px; } .topbar .chip { display:none; } .content { padding:16px; } .kpis { grid-template-columns:1fr 1fr; } .flow { grid-template-columns:1fr 1fr; } .page-head { display:block; } .actions { margin-top:14px; } .filters { grid-template-columns:1fr; } }
    </style>
</head>
<body>
<div class="shell">
    <aside class="side">
        <a class="brand" href="{% url 'dashboard' %}"><span class="brand-mark">H</span><span>HR 데이터<strong>대시보드</strong><small>Gold 조회 계층</small></span></a>
        <div class="nav-title">조회 메뉴</div>
        <nav class="nav">
            <a class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">대시보드</a>
            <a class="{% if request.resolver_match.url_name == 'area_list' or request.resolver_match.url_name == 'area_detail' %}active{% endif %}" href="{% url 'area_list' %}">조직 조회</a>
            <a class="{% if request.resolver_match.url_name == 'organization_tree' %}active{% endif %}" href="{% url 'organization_tree' %}">조직도</a>
            <a class="{% if request.resolver_match.url_name == 'manager_list' or request.resolver_match.url_name == 'manager_detail' %}active{% endif %}" href="{% url 'manager_list' %}">담당자 조회</a>
        </nav>
        <div class="side-note">Bronze 원본 → Silver 표준화·검증 → MySQL Gold 조회</div>
    </aside>
    <div class="main">
        <header class="topbar"><div class="crumb">업무 공간 &nbsp;›&nbsp; <strong>{% block breadcrumb %}대시보드{% endblock %}</strong></div><span class="chip">MySQL Gold 조회</span></header>
        <main class="content">{% block content %}{% endblock %}</main>
    </div>
</div>
</body>
</html>
