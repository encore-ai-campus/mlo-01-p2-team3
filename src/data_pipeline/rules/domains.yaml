# 데이터 도메인·표준화 규칙
# 실제 업무 기준이 변경되면 이 파일을 먼저 수정하고 rule_version을 올린다.

rule_version: "normalization-v1.5"

contract:
  source_type: api_json
  snapshot_type: full_record
  raw_field_count: 17
  # 기존 설정 키 이름은 유지한다. 실제 의미는 API 본문 데이터의 업무 필드 수다.
  meta_field_count: 15
  silver_field_count: 15

  raw_fields:
    - record_id
    - scheduled_release_at
    - area_no
    - area_nm
    - p_area_no
    - p_area_nm
    - top_area_no
    - top_area_nm
    - top_area_lvl
    - mgr_no
    - mgr_nm
    - mgr_dept_nm
    - mgr_pos_nm
    - mgr_hire_dtm
    - mgr_act_yn
    - area_reg_dtm
    - top_area_reg_dtm

  # API 본문 데이터의 업무 필드다.
  # record_id·scheduled_release_at은 선택 응답 메타데이터이며 업무 필드에 포함하지 않는다.
  meta_fields:
    - area_no
    - area_nm
    - p_area_no
    - p_area_nm
    - top_area_no
    - top_area_nm
    - top_area_lvl
    - mgr_no
    - mgr_nm
    - mgr_dept_nm
    - mgr_pos_nm
    - mgr_hire_dtm
    - mgr_act_yn
    - area_reg_dtm
    - top_area_reg_dtm

  silver_fields:
    - area_id
    - area_name
    - parent_area_id
    - parent_area_name
    - top_area_id
    - top_area_name
    - top_area_level
    - manager_id
    - manager_name
    - department_name
    - position_name
    - manager_hire_at
    - manager_active_yn
    - area_registered_at
    - top_area_registered_at

  field_mapping:
    area_no: area_id
    area_nm: area_name
    p_area_no: parent_area_id
    p_area_nm: parent_area_name
    top_area_no: top_area_id
    top_area_nm: top_area_name
    top_area_lvl: top_area_level
    mgr_no: manager_id
    mgr_nm: manager_name
    mgr_dept_nm: department_name
    mgr_pos_nm: position_name
    mgr_hire_dtm: manager_hire_at
    mgr_act_yn: manager_active_yn
    area_reg_dtm: area_registered_at
    top_area_reg_dtm: top_area_registered_at

normalization:
  unicode_form: NFKC
  trim_outer_whitespace: true
  collapse_repeated_whitespace: false
  preserve_internal_whitespace_unless_unique_match: true
  empty_value_action: convert_to_null
  case_sensitive_for_names: false

# 같은 ID의 다른 행에서 하나로 확인되는 값만 누락 필드에 보완한다.
# 후보가 없거나 둘 이상이면 임의로 선택하지 않고 기존 검토 규칙을 적용한다.
missing_value_completion:
  enabled: true
  reference_sources:
    - current_batch
    - approved_silver
  require_unique_non_null_value: true
  conflict_action: KEEP_IN_REVIEW_QUEUE
  entities:
    organization:
      key_field: area_id
      fields:
        - area_name
        - top_area_id
        - top_area_name
        - top_area_level
    manager:
      key_field: manager_id
      fields:
        - manager_name
        - manager_active_yn
        - position_name

null_tokens:
  - ""
  - "없음"
  - "-"
  - "null"
  - "NULL"
  - "n/a"
  - "N/A"

identifiers:
  organization_id:
    source_fields: [area_no, p_area_no, top_area_no]
    silver_fields: [area_id, parent_area_id, top_area_id]
    pattern: '^BIZ[0-9]{5}$'
    normalize: uppercase_and_remove_separators
    invalid_action: REVIEW_REQUIRED

  employee_id:
    source_field: mgr_no
    silver_field: manager_id
    pattern: '^EMP[0-9]{6}$'
    normalize: uppercase_and_remove_separators
    invalid_action: WARNING_NULL
    invalid_warning_code: INVALID_EMPLOYEE_ID
    warning_scope: MANAGER
    warning_blocks_gold:
      - hr_manager
      - hr_area_manager_assignment

status_domains:
  manager_active_yn:
    source_field: mgr_act_yn
    output_values: ["Y", "N"]
    mappings:
      "Y": ["사용", "재직", "YES", "Y", "y", "1"]
      "N": ["퇴직", "NO", "N", "n", "0", "미사용"]
    unknown_action: WARNING_NULL
    unknown_error_code: UNKNOWN_ACTIVE_STATUS
    required_action: WARNING_NULL
    warning_scope: MANAGER
    warning_blocks_gold:
      - hr_manager
      - hr_area_manager_assignment

organization_level:
  source_field: top_area_lvl
  silver_field: top_area_level
  mode: alias_mapping
  # top_area_lvl의 Silver 표준값은 TOP으로 통일한다.
  # 조직 행 자체의 최상위·하위 구분은 area_id와 top_area_id 비교로 별도 계산한다.
  mappings:
    "TOP":
      - "TOP"
      - "TOP_LEVEL"
      - "TOP LEVEL"
      - "top_level"
      - "최상위"
      - "1"
      - "L1"

  # 표준값만 허용한다. UNKNOWN 등 판단할 수 없는 값은 추가하지 않는다.
  allowlist:
    - "TOP"
  allowlist_required: true
  review_before_allowlist_update: true
  unknown_action: REVIEW_REQUIRED
  unknown_error_code: UNREGISTERED_ORGANIZATION_LEVEL

organization_relationship:
  parent_field: parent_area_id
  top_field: top_area_id
  # 현재 배치와 이미 승인된 Silver를 부모 존재 확인용으로 사용한다.
  # Silver 값으로 현재 원문을 덮어쓰지는 않는다.
  reference_sources:
    - current_bronze_batch
    - approved_silver
  parent_reference_scope: bronze_plus_approved_silver
  allow_external_parent: false
  # 부모 문서가 이번 응답에 없어도 parent와 top이 같은 최상위 참조는 허용한다.
  allow_declared_top_reference: true
  declared_top_reference_condition: "parent_area_id == top_area_id"
  unresolved_parent_action: REVIEW_REQUIRED
  root_condition: "area_id == top_area_id"
  child_condition: "area_id != top_area_id"
  preserve_parent_and_top: true
  hierarchy_depth: extensible
  revalidate_when_parent_changes: true
  root_parent_null_allowed: true
  root_self_parent_allowed: true
  child_parent_required: true
  child_parent_must_differ: true
  missing_parent_action: REVIEW_REQUIRED
  self_parent_action_for_child: REVIEW_REQUIRED
  cycle_action: REVIEW_REQUIRED
  changed_area_candidate_action: REVIEW_REQUIRED
  # 현재는 부서 이동을 자동 확정하지 않고 검토 큐에서 승인한다.
  consistent_move_action: REVIEW_REQUIRED
  uncertain_change_action: REVIEW_REQUIRED
  error_codes:
    missing_parent: MISSING_PARENT_AREA
    child_self_parent: SELF_PARENT_REFERENCE
    cyclic_parent: CYCLIC_PARENT_REFERENCE
    changed_area: AREA_CHANGE_REVIEW_REQUIRED
    uncertain_change: AREA_CHANGE_UNCERTAIN

manager_relationship:
  # 한 명의 관리자가 여러 부서를 담당하는 것은 허용한다.
  one_manager_many_areas: true
  one_area_many_managers: false
  # 이름이 달라도 원천 관측 레코드는 Silver에 보존한다.
  # 대표 관리자 값은 자동 선택하지 않고 Gold 관리자·배정 생성만 보류한다.
  identity_fields:
    - manager_name
  # Gold 관리자 문서에 반드시 있어야 하는 값이다.
  required_fields:
    - manager_id
    - manager_name
    - manager_active_yn
  # 직급·입사일은 여러 관측값이 달라도 NULL로 둘 수 있다.
  optional_fields:
    - position_name
    - manager_hire_at
  # 상태·직급 차이는 경고로 기록하되 Silver 저장을 막지 않는다.
  consistency_fields:
    - manager_active_yn
    - position_name
    - manager_hire_at
  consistency_action: WARNING
  # 부서명은 관리자 고유 속성이 아니라 부서 배정 정보로 취급한다.
  area_assignment_fields:
    - department_name
  conflict_action: WARNING
  conflict_warning_code: MANAGER_ATTRIBUTE_CONFLICT
  conflict_scope: MANAGER
  conflict_blocks_gold:
    - hr_manager
    - hr_area_manager_assignment
  same_area_multiple_manager_action: REVIEW_REQUIRED

field_policies:
  manager_name:
    source_field: mgr_nm
    required: true
    # 사람 이름은 내부 공백도 제거한다. 예: " 김 철수 " → "김철수"
    whitespace: remove_all
    required_action: WARNING_NULL
    review_tokens: ["오류값", "UNKNOWN", "N/A"]
    review_error_code: INVALID_MANAGER_NAME
    review_action: WARNING_NULL
    warning_scope: MANAGER
    warning_blocks_gold:
      - hr_manager
      - hr_area_manager_assignment

  department_name:
    source_field: mgr_dept_nm
    nullable: true
    null_tokens: ["미상", "N/A"]
    null_action: WARNING
    reference_tokens: ["기타팀"]
    reference_mappings:
      "기타팀": "OTHER_DEPARTMENT"
    reference_action: WARNING
    reference_warning_code: OTHER_REFERENCE_VALUE

  position_name:
    source_field: mgr_pos_nm
    nullable: true
    null_tokens: ["미상", "N/A"]
    null_action: WARNING
    reference_tokens: ["기타"]
    reference_mappings:
      "기타": "OTHER_POSITION"
    reference_action: WARNING
    reference_warning_code: OTHER_REFERENCE_VALUE

  manager_id:
    source_field: mgr_no
    unknown_tokens: ["UNKNOWN"]
    unknown_action: WARNING_NULL
    unknown_error_code: UNKNOWN_MANAGER_ID
    warning_scope: MANAGER
    warning_blocks_gold:
      - hr_manager
      - hr_area_manager_assignment

versioning:
  batch_field: run_id
  # record_id·scheduled_release_at은 최신성 판단에 사용하지 않는다.
  version_field: null
  version_order_requires_api_contract: true
  compare_full_record: true
  # API에 버전·신뢰할 수 있는 수정 시각이 없으므로 자동 최신값 선택을 하지 않는다.
  auto_select_latest: false
  same_id_rules:
    same_release_same_payload: DUPLICATE
    same_release_different_payload: SOURCE_RECORD_CONFLICT
    newer_valid_full_record: REVIEW_REQUIRED
    newer_invalid_full_record: REVIEW_REQUIRED
    older_arrival: REVIEW_REQUIRED
  gold_update: approved_record_only

processing_status:
  pass: PASS
  warning: PASS_WITH_WARNING
  review_required: REVIEW_REQUIRED
  error: ERROR
  rejected: REJECTED
